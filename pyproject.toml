[project]
name = "python-copier-template"
version = "0.1.0"
description = "Copier template for opinionated Python projects"
requires-python = ">=3.13"
dependencies = [
    "copier>=9.13.0",
]

[dependency-groups]
dev = [
    "json5>=0.13.0",
    "pre-commit>=4.5.1",
    "pytest>=8",
    "python-semantic-release>=10.5.3",
    "ty>=0.0.24",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not slow'"
markers = [
    "devcontainer_build: tests that build a devcontainer image via the devcontainer CLI (require Docker)",
    "slow: tests that are slow to run",
]

[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]

[tool.semantic_release.branches.main]
match = "main"
prerelease = false

[tool.semantic_release.changelog.default_templates]
changelog_file = "CHANGELOG.md"

[tool.semantic_release.commit_parser_options]
allowed_tags = ["feat", "fix", "docs", "style", "refactor", "perf", "test", "chore", "build", "ci"]
minor_tags = ["feat"]
patch_tags = ["fix", "perf", "refactor"]

[tool.semantic_release.remote]
type = "github"

[tool.semantic_release.publish]
upload_to_vcs_release = true
