[project]
name = "python-copier-template"
version = "0.1.0"
description = "Copier template for opinionated Python projects"
requires-python = ">=3.13"
dependencies = [
    "copier>=9.13.0",
]

[dependency-groups]
dev = [
    "json5>=0.13.0",
    "pre-commit>=4.5.1",
    "pytest>=8",
    "ty>=0.0.24",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not slow'"
markers = [
    "devcontainer_build: tests that build a devcontainer image via the devcontainer CLI (require Docker)",
    "slow: tests that are slow to run",
]
